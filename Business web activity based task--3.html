<!DOCTYPE html>
<html>
<head>
  <title>Simple Business Dashboard</title>

  <style>
body {
font-family: Arial;
background: #f2f4f7;
color: #333;
}

.cards {
display: flex;
}

.card{
background: white;
padding: 15px;
margin: 10px 0;
}

.card {
flex: 1;
min-width: 150px;
}

.number {
font-size: 24px;
color: #315ca8;
}

  </style>
</head>
<body>

<h2>Business Overview</h2>
<div class="cards">
<div class="card">Revenue
<p class="number">$24,680</p>
</div>
<div class="card">Customers
<p class="number">1,248</p>
</div>
<div class="card">Orders
<p class="number">3,672</p>
</div>
</div>

<div>
<h2>Monthly Sales Goal</h2>
<p>We have earned <b>$24,680</b> of our <b>$30,000</b> goal this month.</p>
<p>We need $5,320 more to reach our goal.</p>
</div>

<div>
<h2>Recent Activity</h2>
<ol>
<li>Online store order — Oct 26</li>
<li>Monthly report — Oct 25</li>
<li>New customer — Oct 24</li>
</ol>
</div>

</body>
</html>
